[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "where-paper-go"
version = "0.1.0"
description = "Quality-first academic venue recommendation with LightRAG, semantic vectors, LLMs, and web evidence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "lightrag-hku>=1.4.14,<1.6",
  "numpy>=1.26,<3",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
where-paper-go = "where_paper_go.recommender:main"
where-paper-go-web = "where_paper_go.web_app:main"
where-paper-go-enrich = "where_paper_go.enrichment:main"
where-paper-go-research = "research.cli:main"

[tool.setuptools.packages.find]
include = ["where_paper_go*", "scripts*", "research*"]

[tool.setuptools.package-data]
where_paper_go = ["static/*"]
