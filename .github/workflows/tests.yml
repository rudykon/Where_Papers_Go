name: tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  fixed-static:
    name: fixed-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false
      - name: Require the exact event revision and a clean checkout
        env:
          WPG_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$WPG_EXPECTED_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          test "$(/usr/bin/python3.12 --version)" = "Python 3.12.3"
      - name: Verify fixed manifest, credentials, logo, lock, and diff
        env:
          WPG_PR_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: >-
          /usr/bin/env -i
          PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8
          HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          /usr/bin/python3.12 -I -S
          "${{ github.workspace }}/scripts/validate_pr_gates.py"
          static --base "$WPG_PR_GATE_BASE"
          --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json"

  fixed-full:
    name: fixed-full
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false
      - name: Require the exact event revision and fixed inputs
        env:
          WPG_EXPECTED_SHA: ${{ github.sha }}
          WPG_PR_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$WPG_EXPECTED_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          test "$(/usr/bin/python3.12 --version)" = "Python 3.12.3"
          /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            /usr/bin/python3.12 -I -S \
            "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            static --base "$WPG_PR_GATE_BASE" \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json"
      - name: Install fixed uv without an action cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Create the wheel-only locked full-suite environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wpg-pr-full
        run: >-
          uv sync --locked --no-dev --no-install-project --no-build
          --no-sources --no-cache --python /usr/bin/python3.12 --no-config
      - name: Reverify fixed inputs, then require 489 = 485 pass + 4 skips
        env:
          WPG_PR_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          set -Eeuo pipefail
          /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            /usr/bin/python3.12 -I -S \
            "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            static --base "$WPG_PR_GATE_BASE" \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json"
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin GITHUB_ACTIONS=true \
            RUNNER_TEMP="${{ runner.temp }}" \
            RUNNER_TOOL_CACHE="${{ runner.tool_cache }}" \
            /bin/bash --noprofile --norc scripts/run_linux_offline_gate.sh \
            "${{ runner.temp }}/wpg-pr-full/bin/python" \
            -I -S "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            tests --suite full \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json" \
            --require-os-isolation

  fixed-retrieval:
    name: fixed-retrieval
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false
      - name: Require the exact event revision and fixed inputs
        env:
          WPG_EXPECTED_SHA: ${{ github.sha }}
          WPG_PR_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$WPG_EXPECTED_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          test "$(/usr/bin/python3.12 --version)" = "Python 3.12.3"
          /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            /usr/bin/python3.12 -I -S \
            "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            static --base "$WPG_PR_GATE_BASE" \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json"
      - name: Install fixed uv without an action cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Create the wheel-only locked retrieval environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wpg-pr-retrieval
        run: >-
          uv sync --locked --no-dev --no-install-project --no-build
          --no-sources --no-cache --python /usr/bin/python3.12 --no-config
      - name: Reverify fixed inputs, then require deterministic retrieval 7/7
        env:
          WPG_PR_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          set -Eeuo pipefail
          /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            /usr/bin/python3.12 -I -S \
            "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            static --base "$WPG_PR_GATE_BASE" \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json"
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin GITHUB_ACTIONS=true \
            RUNNER_TEMP="${{ runner.temp }}" \
            RUNNER_TOOL_CACHE="${{ runner.tool_cache }}" \
            /bin/bash --noprofile --norc scripts/run_linux_offline_gate.sh \
            "${{ runner.temp }}/wpg-pr-retrieval/bin/python" \
            -I -S "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            retrieval \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json" \
            --require-os-isolation

  fixed-model:
    name: fixed-model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false
      - name: Require the exact event revision and fixed inputs
        env:
          WPG_EXPECTED_SHA: ${{ github.sha }}
          WPG_PR_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$WPG_EXPECTED_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          test "$(/usr/bin/python3.12 --version)" = "Python 3.12.3"
          /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            /usr/bin/python3.12 -I -S \
            "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            static --base "$WPG_PR_GATE_BASE" \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json"
      - name: Install fixed uv without an action cache
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Install the exact PEP 751 model wheel set
        run: |
          set -Eeuo pipefail
          uv venv --no-project --no-cache --python /usr/bin/python3.12 \
            "${{ runner.temp }}/wpg-pr-model" --no-config
          uv pip install --preview-features pylock --require-hashes --strict \
            --no-deps --only-binary :all: --no-index --no-cache \
            --python "${{ runner.temp }}/wpg-pr-model/bin/python" \
            -r .github/pylock.wpg-pr-model.toml --no-config
      - name: Reverify fixed inputs, then require model-focused 6/6
        env:
          WPG_PR_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: |
          set -Eeuo pipefail
          /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            HOME=/nonexistent PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            /usr/bin/python3.12 -I -S \
            "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            static --base "$WPG_PR_GATE_BASE" \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json"
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin GITHUB_ACTIONS=true \
            RUNNER_TEMP="${{ runner.temp }}" \
            RUNNER_TOOL_CACHE="${{ runner.tool_cache }}" \
            /bin/bash --noprofile --norc scripts/run_linux_offline_gate.sh \
            "${{ runner.temp }}/wpg-pr-model/bin/python" \
            -I -S "${{ github.workspace }}/scripts/validate_pr_gates.py" \
            tests --suite model-focused \
            --manifest "${{ github.workspace }}/.github/pr-gate-manifest.json" \
            --require-os-isolation

  fixed-pr-gates:
    name: fixed-pr-gates
    if: ${{ always() }}
    needs: [fixed-static, fixed-full, fixed-retrieval, fixed-model]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every independent fixed gate
        env:
          STATIC_RESULT: ${{ needs.fixed-static.result }}
          FULL_RESULT: ${{ needs.fixed-full.result }}
          RETRIEVAL_RESULT: ${{ needs.fixed-retrieval.result }}
          MODEL_RESULT: ${{ needs.fixed-model.result }}
        run: |
          set -Eeuo pipefail
          test "$STATIC_RESULT" = success
          test "$FULL_RESULT" = success
          test "$RETRIEVAL_RESULT" = success
          test "$MODEL_RESULT" = success

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false
      - name: Require the exact event revision and a clean checkout
        env:
          WPG_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$WPG_EXPECTED_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Create the locked dependency-only matrix environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wpg-unit-${{ matrix.python-version }}
        run: >-
          uv sync --locked --no-dev --no-install-project --no-build
          --no-sources --no-cache --python "$pythonLocation/bin/python"
          --no-config
      - name: Run the matrix suite as the terminal offline step
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: >-
          /bin/bash --noprofile --norc scripts/run_linux_offline_gate.sh
          "${{ runner.temp }}/wpg-unit-${{ matrix.python-version }}/bin/python"
          -m unittest discover -s tests -p 'test_*.py' -v

  installed-wheel-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false
      - name: Require the exact event revision and a clean checkout
        env:
          WPG_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(/usr/bin/git rev-parse --verify HEAD)" = "$WPG_EXPECTED_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.14"
          enable-cache: false
      - name: Create a locked dependency-only wheel build environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/wpg-wheel-build
        run: |
          set -Eeuo pipefail
          uv sync --locked --no-dev --no-install-project --no-build \
            --no-sources --no-cache --python "$pythonLocation/bin/python" \
            --no-config
          uv pip install --preview-features pylock --require-hashes --strict \
            --python "${{ runner.temp }}/wpg-wheel-build/bin/python" \
            --no-cache --no-deps --only-binary :all: --no-index --no-config \
            -r .github/pylock.wpg-wheel-build.toml
      - name: Build, install, and smoke-test as one terminal offline step
        env:
          RUNNER_TOOL_CACHE: ${{ runner.tool_cache }}
        run: |
          exec /bin/bash --noprofile --norc scripts/run_linux_offline_gate.sh \
            /bin/bash --noprofile --norc -Eeuo pipefail -c '
              build_python="$1"
              /usr/bin/mkdir -p /tmp/wpg-dist /tmp/wpg-src
              /usr/bin/git -c core.hooksPath=/dev/null archive \
                --format=tar --output=/tmp/wpg-src.tar HEAD
              /usr/bin/tar --extract --file=/tmp/wpg-src.tar \
                --directory=/tmp/wpg-src --no-same-owner --no-same-permissions
              cd /tmp/wpg-src
              "$build_python" -m build --wheel --no-isolation \
                --outdir /tmp/wpg-dist .
              mapfile -t wheels < <(
                /usr/bin/find /tmp/wpg-dist -maxdepth 1 -type f -name "*.whl"
              )
              [[ "${#wheels[@]}" -eq 1 ]]
              "$build_python" -m venv /tmp/wpg-wheel-runtime
              /tmp/wpg-wheel-runtime/bin/python -m pip install \
                --no-index --no-deps "${wheels[0]}"
              build_site="$(
                "$build_python" -c \
                  "import sysconfig; print(sysconfig.get_path(\"purelib\"))"
              )"
              cd /tmp
              PYTHONPATH="$build_site" \
                /tmp/wpg-wheel-runtime/bin/where-paper-go --help
              PYTHONPATH="$build_site" \
                /tmp/wpg-wheel-runtime/bin/where-paper-go-web --help
              PYTHONPATH="$build_site" \
                /tmp/wpg-wheel-runtime/bin/where-paper-go-research --help
              PYTHONPATH="$build_site" /tmp/wpg-wheel-runtime/bin/python -c \
                "from importlib.resources import files; assert files(\"where_paper_go\").joinpath(\"static/index.html\").is_file()"
            ' wpg-wheel "${{ runner.temp }}/wpg-wheel-build/bin/python"
