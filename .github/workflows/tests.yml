name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  deterministic-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m scripts.benchmark_retrieval --format json
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  installed-wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python -m venv "$RUNNER_TEMP/where-paper-go-wheel"
      - run: "$RUNNER_TEMP/where-paper-go-wheel/bin/python" -m pip install dist/*.whl
      - name: Smoke-test installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/where-paper-go-wheel/bin/where-paper-go" --help
          "$RUNNER_TEMP/where-paper-go-wheel/bin/where-paper-go-web" --help
          "$RUNNER_TEMP/where-paper-go-wheel/bin/where-paper-go-research" --help
          "$RUNNER_TEMP/where-paper-go-wheel/bin/python" -c "from importlib.resources import files; assert files('where_paper_go').joinpath('static/index.html').is_file()"
